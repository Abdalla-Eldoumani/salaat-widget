name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
          - platform: linux
            runner: ubuntu-22.04

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Salaat Widget ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your platform below. None of them are code-signed.

            **Windows** - Pick `Salaat.Widget_<version>_x64-setup.exe` for the smallest download; it installs the WebView2 runtime if it is missing. The `.msi` is for managed installs. SmartScreen warns on first run: select *More info*, then *Run anyway*.

            **macOS** - Apple Silicon only (`Salaat.Widget_<version>_aarch64.dmg`). Open the disk image and drag the app into Applications. On first launch right-click the app and choose *Open* to get past Gatekeeper.

            **Linux** - Install `Salaat.Widget_<version>_amd64.deb` with `sudo dpkg -i`, or run the `.AppImage` after `chmod +x`. GNOME users need the AppIndicator extension for the tray icon.

            **Checksums** - `SHA256SUMS.txt` lists the SHA-256 of every file above. Compare it with `sha256sum <file>` on Linux, `shasum -a 256 <file>` on macOS, or `Get-FileHash <file>` in PowerShell.
          releaseDraft: true
          prerelease: false
          args: --ci

  # Runs once all three platforms have uploaded, so the sums cover every asset under the name
  # people download it by.
  checksums:
    name: Checksums
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Add SHA-256 sums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets
          # A re-run finds the file from the last run and must not hash it.
          rm -f assets/SHA256SUMS.txt
          (cd assets && sha256sum -- *) > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
