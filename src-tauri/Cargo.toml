[package]
name = "salaat-widget"
version = "0.2.0"
edition = "2021"

[lib]
name = "salaat_widget_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.7.1"

[dependencies]
tauri = { version = "=2.12.2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "=2.5.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-store = "=2.5.0"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-http = "=2.8.1"
# Held at 0.19: later releases change the OutputStream and Sink API.
rodio = "=0.19.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["time"] }
chrono = "=0.4.45"

[profile.dev]
debug = "line-tables-only"
